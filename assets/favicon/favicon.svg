<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e8455e"/>
      <stop offset="100%" stop-color="#a3172f"/>
    </radialGradient>
    <radialGradient id="disc" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f3ead4"/>
    </radialGradient>
  </defs>

  <!-- pallina della tombola -->
  <circle cx="50" cy="50" r="47" fill="url(#ball)"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#ffd700" stroke-width="5"/>

  <!-- riflesso lucido -->
  <ellipse cx="35" cy="28" rx="16" ry="9" fill="#ffffff" opacity="0.35"/>

  <!-- disco centrale come un numero della tombola -->
  <circle cx="50" cy="52" r="33" fill="url(#disc)" stroke="#165b33" stroke-width="2.5"/>

  <!-- monogramma RV -->
  <text x="50" y="65" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="34" fill="#c41e3a" text-anchor="middle" letter-spacing="-1">RV</text>

  <!-- stellina dorata in stile tombola/decoro natalizio -->
  <path d="M78 20 l2.3 5.1 5.6 0.6 -4.1 3.9 1.1 5.6 -4.9 -2.9 -4.9 2.9 1.1 -5.6 -4.1 -3.9 5.6 -0.6 Z"
        fill="#ffd700"/>
</svg>
